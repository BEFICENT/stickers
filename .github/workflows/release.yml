name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency=1
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          {
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/android/app/release-keystore.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release --no-pub
      - run: flutter build appbundle --release --no-pub
      - name: Prepare artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "stickers-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "stickers-${GITHUB_REF_NAME}.aab"
          sha256sum "stickers-${GITHUB_REF_NAME}.apk" "stickers-${GITHUB_REF_NAME}.aab" \
            > "stickers-${GITHUB_REF_NAME}-sha256.txt"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "stickers-${GITHUB_REF_NAME}.apk" \
            "stickers-${GITHUB_REF_NAME}.aab" \
            "stickers-${GITHUB_REF_NAME}-sha256.txt" \
            --generate-notes \
            --verify-tag
      - name: Remove signing material
        if: always()
        run: rm -f android/app/release-keystore.jks android/key.properties
